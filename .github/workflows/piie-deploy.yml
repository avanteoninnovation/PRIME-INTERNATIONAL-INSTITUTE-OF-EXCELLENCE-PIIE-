# =============================================================================
# PIIE — Production Deployment  (PREPARED — NOT ENABLED)
# =============================================================================
#
#   ############################################################
#   #  THIS WORKFLOW IS DELIBERATELY DISABLED.                #
#   #  The final `on:` is commented out. As written this      #
#   #  file can never run. To enable it you must approve the  #
#   #  release strategy AND uncomment that block.             #
#   ############################################################
#
# It is committed as a reviewed artefact so the deployment design can be
# discussed, corrected and approved before anything is capable of touching
# production. It has never been executed.
#
# ── WHY IT IS DISABLED RATHER THAN ABSENT ─────────────────────────────────────
# A workflow that does not exist cannot be reviewed, and a review that happens
# after it is written tends to be a rubber stamp. Writing it disabled means the
# backups, the symlink swap and the rollback are all on the record BEFORE the
# first production run.
#
# ── WHY `workflow_dispatch` IS STILL AVAILABLE ───────────────────────────────
# Manual dispatch, with a required typed confirmation, is the intended trigger.
# It gives a human an explicit, auditable, deliberate act per deployment — which
# is the whole point of "manually approved".
#
# ── THE SECRET DEPENDENCY ─────────────────────────────────────────────────────
# This workflow requires five GitHub Actions secrets. Their EXISTENCE IN GITHUB
# HAS NOT YET BEEN CONFIRMED, so this workflow could not run today even if the
# `on:` block were uncommented:
#
#   PIIE_SSH_HOST           production SSH hostname
#   PIIE_SSH_PORT           production SSH port (25552, NOT the DirectAdmin port)
#   PIIE_SSH_USER           production SSH user (piie)
#   PIIE_SSH_KEY            the v3 replacement private deployment key
#   PIIE_SSH_KNOWN_HOSTS    independently verified host key
#
# ── WHICH KEY IS AUTHORISED ───────────────────────────────────────────────────
# v3 ONLY. Independently verified against the production host on 2026-10-03:
#
#   v3  SHA256:6Hnrk+QwL5lsM2cyqscy1/QSIxx1/AZXpl82Z5nY44U  ACCEPTED (whoami -> piie)
#   v2  SHA256:kkAq1hmo102n0YJc9SedqkgYhjpqSpqZrLGGEtBXXiE  REJECTED (revoked)
#
# `PIIE_SSH_KEY` MUST contain the v3 private key. The v1/v2 keys are revoked and
# must never be placed in that secret, in this repository, or in any log. This
# workflow NEVER references a local key file: the key arrives only as a GitHub
# secret, so no developer machine's filesystem is part of the deployment path.
#
# ── BLOCKING PREREQUISITES FOUND DURING THE 2026-10-03 PRODUCTION SURVEY ──────
# Three things were verified read-only over the v3 key. Each must be resolved
# before this workflow is enabled:
#
# 1. PHP 8.3 IS PRESENT AND IS THE CORRECT VERSION - but it is not the default.
#
#    Resolved 2026-10-03. An earlier survey reported "PHP 8.2.27" and inferred
#    that 8.3 was unavailable. That inference was WRONG. What is actually true:
#
#      /usr/local/php83/bin/php              -> PHP 8.3.12  (CLI, intended build)
#      /usr/local/php83/bin/lsphp            -> LiteSpeed handler, same 8.3 install
#      /usr/local/bin/php                    -> php81 build = PHP 8.2.27
#      /usr/local/directadmin/data/users/piie/php/php.ini -> alt-php82
#
#    BOTH versions are installed. DirectAdmin's PHP selector writes the per-user
#    php.ini, and for this account it points at the 8.2 configuration.
#
#    CONSEQUENCE - this is why every PHP invocation below names the binary
#    explicitly. A bare `php`, `composer` or `php artisan` resolves through PATH to
#    8.2.27, and a dependency tree resolved for 8.3 (config.platform.php = 8.3.0)
#    would then be running on 8.2. It is a PATH trap, not a missing runtime, and it
#    is silent: both parsers accept the same source.
#
#    config.platform.php STAYS at 8.3.0. Do NOT downgrade it and do NOT re-lock
#    for 8.2 - the application targets 8.3 and composer.lock is resolved for it.
#    Operator-side remediation is to set the DirectAdmin PHP selector for this
#    account to 8.3; until then, explicit binaries are mandatory.
#
# 2. DOCUMENT ROOT IS NOT A SYMLINK. `/home/piie/domains/piie.ac.ug/public_html`
#      is a real directory that contains the APPLICATION ROOT (artisan, app/,
#      vendor/, config/, and a nested public/). It is not a document root holding
#      only index.php. Replacing it with a release symlink would change the served
#      layout. The vhost document root in DirectAdmin must be confirmed first.
#
#   3. NO NODE ON THE HOST. Compiled Mix assets and `public/mix-manifest.php` must
#      come from the repository, or the release will have no CSS or JS.
#
# ── THE HOST KEY IS PINNED ────────────────────────────────────────────────────
# The host key is pinned, not discovered. Accepting whatever the server presents is
# the mechanism by which a compromised server silently harvests a deployment key,
# and `ssh-keyscan` at run time would reintroduce exactly that.
#
# Independently verified 2026-10-03:
#   ED25519  SHA256:AJCXGAyIoflDFBnXb6kxSGAALqUI9kOE0Bo4SHsUbTE  <-- pin this one
#   ECDSA    SHA256:V3IvgFSNvW9k/NCSsA1eS1C5kMs+O0EeqzlPvNyX9TE
#   RSA      SHA256:JV8Mu6W0Kimlkuyy8qp3inEzKuP+3nOVhP9FfZM3g1E
#
# ── RELEASE LAYOUT ────────────────────────────────────────────────────────────
#   /home/piie/deployments/piie/
#     ├── releases/<timestamp>/     each deployed tree, retained
#     ├── shared/                   survives across releases:
#     │     ├── .env                 production environment, never overwritten
#     │     └── storage/             logs, framework cache, generated uploads
#     └── backups/                  database dumps taken before each deploy
#
# Only `shared/` is written to by the app. `releases/` is append-only.
#
# ── WHAT IS DELIBERATELY NOT DONE ─────────────────────────────────────────────
#   - No `rsync --delete` against the live document root. The existing live tree
#     is NOT a Git working tree, so it may hold files this repository does not
#     know about. `--delete` would remove them permanently.
#   - No migration is run without a verified backup immediately before it.
#   - No `.env` is ever written from this repository.
#   - Existing uploaded files are not touched; they are not in this repository.
# =============================================================================

name: PIIE Deploy (disabled)

# ─────────────────────────────────────────────────────────────────────────────
# DISABLED. Uncomment ONLY after the release strategy is approved.
#
# on:
#   workflow_dispatch:
#     inputs:
#       confirm:
#         description: 'Type "DEPLOY TO PRODUCTION" to proceed'
#         required: true
#         type: string
#       ref:
#         description: 'Git ref or SHA to deploy (defaults to the current commit)'
#         required: false
#         default: ''
#         type: string
# ─────────────────────────────────────────────────────────────────────────────

# Kept out of reach while disabled. `if: false` is belt-and-braces: even a
# stray `workflow_dispatch` or a re-enabled trigger cannot reach the SSH step.
permissions:
  contents: read

jobs:
  preflight:
    name: Deployment preflight (no production access)
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    # Runs today. It touches nothing on the production host — it validates the
    # release inputs and prints exactly what a deployment WOULD do, so the
    # sequence can be reviewed while it is still inert.
    if: false

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Assert the manual-deployment confirmation gate is present
        run: |
          if ! grep -q 'DEPLOY TO PRODUCTION' .github/workflows/piie-deploy.yml; then
            echo "::error::The typed-confirmation gate is missing."
            exit 1
          fi

      - name: Assert this workflow is still disabled
        run: |
          if grep -qE '^\s*on:\s*$' .github/workflows/piie-deploy.yml; then
            echo "::error::This workflow appears to be ENABLED. It must stay disabled until approved."
            exit 1
          fi
          echo "Confirmed disabled."

      - name: Assert composer.lock is tracked (CI reproducibility)
        run: |
          # Without this, every CI run resolves dependencies fresh instead of
          # installing a tested tree. Verified 2026-10-03 as the single most
          # important thing to fix before the first push.
          if git ls-files --error-unmatch composer.lock >/dev/null 2>&1; then
            echo "composer.lock is tracked."
          else
            echo "::warning::composer.lock is NOT tracked. CI will not be reproducible."
          fi

      - name: Report tracked files that .gitignore no longer covers
        run: |
          # Belt-and-braces. .gitignore protects NEW files; it does not untrack.
          TRACKED=$(git ls-files -ci --exclude-standard || true)
          if [ -n "$TRACKED" ]; then
            echo "::warning::Tracked yet now gitignored (these ship regardless):"
            echo "$TRACKED" | sed 's/^/  /'
            echo "::warning::See STAGING-MANIFEST.md before the first push."
          else
            echo "No tracked-but-ignored files."
          fi

      - name: Require zero UNEXPECTED test failures before any deployment may be enabled
        run: |
          # ITEM 4 - a matching failure COUNT is not evidence that deployment is safe.
          #
          # The 14 failures in these four classes are pre-existing and unrelated to
          # CI. But a count can match for the WRONG reason: a real regression that
          # breaks one known failure while another is fixed leaves the total
          # unchanged. A real gate must compare failing test IDENTITIES.
          #
          # This step REPORTS only. It deliberately does not pass or fail yet,
          # because piie-ci.yml has never executed, so there is no run to compare
          # against and nothing it could say would count as evidence.
          echo "Classes permitted to fail at the deployment gate:"
          echo "  CourseOfferingAdministrationTest"
          echo "  LiveClassCertificationTest"
          echo "  MultinationalTimezoneTest"
          echo "  TenantTimezoneTest"
          echo ""
          echo "AUTOMATIC DEPLOYMENT MUST NOT BE ENABLED UNTIL:"
          echo "  1. piie-ci.yml has completed a full run on this branch"
          echo "  2. these 14 failures are fixed, or formally waived in writing"
          echo "  3. the gate compares failing test NAMES, not counts"
          echo ""
          echo "A suite that cannot tell a regression from a known failure is not a"
          echo "deployment gate. Treat the baseline as a ratchet, not as a pass."
      - name: Assert the required secrets are present (names only, values never printed)
        env:
          PIIE_SSH_HOST: ${{ secrets.PIIE_SSH_HOST }}
          PIIE_SSH_PORT: ${{ secrets.PIIE_SSH_PORT }}
          PIIE_SSH_USER: ${{ secrets.PIIE_SSH_USER }}
          PIIE_SSH_KEY: ${{ secrets.PIIE_SSH_KEY }}
          PIIE_SSH_KNOWN_HOSTS: ${{ secrets.PIIE_SSH_KNOWN_HOSTS }}
        run: |
          MISSING=0
          for NAME in PIIE_SSH_HOST PIIE_SSH_PORT PIIE_SSH_USER PIIE_SSH_KEY PIIE_SSH_KNOWN_HOSTS; do
            VALUE="${!NAME}"
            if [ -z "$VALUE" ]; then
              echo "  MISSING: $NAME"
              MISSING=1
            else
              # Presence and length only. A value is never echoed.
              echo "  present: $NAME (${#VALUE} chars)"
            fi
          done
          if [ "$MISSING" != "0" ]; then
            echo "::error::One or more deployment secrets are absent. Set them before enabling this workflow."
            exit 1
          fi

